    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --label: #f5f5f7;
            --label-2: rgba(235, 235, 245, 0.6);
            --label-3: rgba(235, 235, 245, 0.3);
            --grouped: rgba(44, 44, 46, 0.55);
            --separator: rgba(84, 84, 88, 0.55);
            --hairline: rgba(255, 255, 255, 0.1);
            --blue: #0a84ff;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(48px, 12vh, 120px) 20px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #000;
            font-family: var(--font);
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--label);
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: min(480px, 100%);
            text-align: center;
            animation: rise 0.8s cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
        }

        .card > img { width: 96px; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.5)); }

        h1 {
            margin: 12px 0 36px;
            font-family: var(--font-display);
            font-size: clamp(40px, 9vw, 56px);
            font-weight: 700;
            letter-spacing: -0.045em;
        }

        h2 {
            margin: 0 0 8px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: var(--label-2);
        }

        ul {
            list-style: none;
            margin: 0 0 28px;
            padding: 0;
            border-radius: 14px;
            background: var(--grouped);
            text-align: left;
        }

        li {
            position: relative;
            padding: 14px 16px;
            font-size: 16px;
        }

        li + li::before {
            content: '';
            position: absolute;
            top: 0;
            left: 16px;
            right: 0;
            border-top: 0.5px solid var(--separator);
        }

        li a {
            display: flex;
            justify-content: space-between;
            color: inherit;
            text-decoration: none;
        }

        li a::after {
            content: '›';
            font-size: 20px;
            line-height: 1;
            color: var(--label-3);
        }

        li a:hover { color: var(--blue); }

        .note {
            margin: 0 16px;
            text-align: left;
            font-size: 13px;
            line-height: 1.45;
            color: var(--label-2);
        }

        .back {
            display: inline-block;
            margin-top: 36px;
            padding: 13px 28px;
            border-radius: 999px;
            background: var(--blue);
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .back:hover { background: #2b95ff; }
    </style>
</head>
<body>
    <main class="card">
        <img src="assets/images/icons/logo.svg" alt="">
        <h1>Credits</h1>

        <h2>Made by</h2>
        <ul id="people"><li>Loading…</li></ul>

        <h2>Built with</h2>
        <ul>
            <li><a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a></li>
            <li><a href="https://hyruleguessr.com" target="_blank" rel="noopener">HyruleGuessr – the inspiration</a></li>
        </ul>

        <p class="note">
            TotK Guesser is a non-commercial fan project.<br>
            The Legend of Zelda: Tears of the Kingdom and all related assets are © Nintendo.
        </p>

        <a class="back" href="index.html">Back to the game</a>
    </main>

    <script>
        fetch("assets/libraries/credits.json")
            .then((r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then((data) => {
                const list = document.getElementById("people");
                list.replaceChildren(
                    ...data.names.map((name) => {
                        const li = document.createElement("li");
                        li.textContent = name;
                        return li;
                    })
                );
            })
            .catch(() => {
                document.getElementById("people").innerHTML = "<li>Max</li><li>Tobias</li>";
            });
    </script>
</body>
</html>
